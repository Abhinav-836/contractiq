# Alembic config. The database URL comes from DATABASE_URL (core.config), not
# from this file. Migrations also run automatically on app startup
# (db/migrate.py), so you normally don't need to run them by hand.
#
# Manual use, from the backend/ folder:
#   alembic upgrade head                         # apply migrations
#   alembic revision --autogenerate -m "message" # after changing a model

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
